name: Englify
options:
  bundleIdPrefix: com.aliakseiloi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_NAME: Englify

targets:
  Englify:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Englify/Sources
      - path: Englify/Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliakseiloi.englify
        INFOPLIST_FILE: Englify/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: HotKey
